  <script>
    if (!window.location.hash) {
      history.scrollRestoration = "manual";
      window.scrollTo(0, 0);
    }

    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightboxImg");
    const lightboxStage = document.getElementById("lightboxStage");
    const lightboxClose = document.getElementById("lightboxClose");
    const cards = document.querySelectorAll("[data-tilt]");

    const gallerySrcs = [];
    cards.forEach((card) => {
      const img = card.querySelector(".card-inner img");
      if (img && img.getAttribute("src")) gallerySrcs.push(img.src);
    });
    let currentIndex = 0;

    cards.forEach((card) => {
      const inner = card.querySelector(".card-inner");

      card.addEventListener("mouseenter", () => {
        document.body.classList.add("gallery-focus");
        card.classList.add("is-hovered");
      });

      card.addEventListener("mouseleave", () => {
        document.body.classList.remove("gallery-focus");
        card.classList.remove("is-hovered");
        inner.style.transform = "scale(1) translate(0px, 0px)";
      });

      card.addEventListener("mousemove", (e) => {
        const rect = card.getBoundingClientRect();
        const moveX = ((e.clientX - rect.left - rect.width / 2) / (rect.width / 2)) * 14;
        const moveY = ((e.clientY - rect.top - rect.height / 2) / (rect.height / 2)) * 14;
        inner.style.transform = `scale(1.12) translate(${moveX}px, ${moveY}px)`;
      });

      card.addEventListener("click", () => {
        const img = inner.querySelector("img");
        if (img && img.src) {
          currentIndex = Math.max(0, gallerySrcs.indexOf(img.src));
          openLightbox(img.src);
        }
      });
    });

    let scale = 1, posX = 0, posY = 0, isDragging = false, startX = 0, startY = 0;

    function applyTransform() {
      const maxX = (lightboxImg.offsetWidth * scale) * 0.4;
      const maxY = (lightboxImg.offsetHeight * scale) * 0.4;
      posX = Math.min(Math.max(posX, -maxX), maxX);
      posY = Math.min(Math.max(posY, -maxY), maxY);
      lightboxImg.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
    }

    function openLightbox(src) {
      scale = 1; posX = 0; posY = 0;
      applyTransform();
      lightboxImg.src = src;
      lightbox.classList.add("open");
      document.body.style.overflow = "hidden";
      document.body.classList.remove("gallery-focus");
    }

    function closeLightbox() {
      lightbox.classList.remove("open");
      document.body.style.overflow = "";
      lightboxImg.src = "";
      scale = 1; posX = 0; posY = 0;
    }

    function showNext() {
      if (!gallerySrcs.length) return;
      currentIndex = (currentIndex + 1) % gallerySrcs.length;
      openLightbox(gallerySrcs[currentIndex]);
    }

    function showPrev() {
      if (!gallerySrcs.length) return;
      currentIndex = (currentIndex - 1 + gallerySrcs.length) % gallerySrcs.length;
      openLightbox(gallerySrcs[currentIndex]);
    }

    lightboxClose.addEventListener("click", closeLightbox);
    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox || e.target === lightboxStage) closeLightbox();
    });

    document.addEventListener("keydown", (e) => {
      if (!lightbox.classList.contains("open")) return;
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowRight") { e.preventDefault(); showNext(); }
      if (e.key === "ArrowLeft") { e.preventDefault(); showPrev(); }
    });

    lightbox.addEventListener("wheel", (e) => {
      if (!lightbox.classList.contains("open")) return;
      e.preventDefault();
      scale = Math.min(Math.max(1, scale + (e.deltaY > 0 ? -0.15 : 0.15)), 5);
      applyTransform();
    }, { passive: false });

    lightboxImg.addEventListener("mousedown", (e) => {
      e.preventDefault();
      e.stopPropagation();
      isDragging = true;
      startX = e.clientX - posX;
      startY = e.clientY - posY;
      lightboxImg.style.cursor = "grabbing";
    });

    window.addEventListener("mousemove", (e) => {
      if (!isDragging) return;
      posX = e.clientX - startX;
      posY = e.clientY - startY;
      applyTransform();
    });

    window.addEventListener("mouseup", () => {
      isDragging = false;
      lightboxImg.style.cursor = "grab";
    });

    let lastTouchDist = 0;
    lightboxImg.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        startX = e.touches[0].clientX - posX;
        startY = e.touches[0].clientY - posY;
      } else if (e.touches.length === 2) {
        isDragging = false;
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        lastTouchDist = Math.hypot(dx, dy);
      }
    }, { passive: true });

    lightboxImg.addEventListener("touchmove", (e) => {
      e.preventDefault();
      if (e.touches.length === 1 && isDragging) {
        posX = e.touches[0].clientX - startX;
        posY = e.touches[0].clientY - startY;
        applyTransform();
      } else if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        scale = Math.min(Math.max(1, scale + (dist - lastTouchDist) * 0.01), 5);
        lastTouchDist = dist;
        applyTransform();
      }
    }, { passive: false });

    lightboxImg.addEventListener("touchend", () => { isDragging = false; });
  </script>
